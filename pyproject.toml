[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "poeme"
description = "A Python package for thermodynamic cycle analysis."
readme = "README.rst"
dynamic = ["version"]

dependencies = [
    "numpy",
    "scipy",
    "Coolprop",
    "cantera",
]

[dependency-groups]
lint = ["ruff"]
test = ["pytest", "pytest-cov"]
doc = ["sphinx"]

dev = [
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "doc"},
]

[tool.setuptools_scm]
write_to = "src/poeme/_version.py"

[tool.ruff]
exclude = ["design/*"]

[tool.ruff.lint]
select = [
    "S", # flake8-bandit
    "B", # flake8-bugbear
    "EM", # flake8-errmsg
    "PT", # flake8-pytest-style
    "SIM", # flake8-simplify
    "I", # isort
    "NPY", # numpy-specific-rules
    "N", # pep8-naming
    "PERF", # perflint
    "E","W", # pycodestyle
    # "D", # pydocstyle
    "F", # pyflakes
    "PL", # pylint
    "UP", # pyupgrade
]
ignore = [
    "E712", # Avoid equality comparisons to `False` (needed for BooleanT)
    "N802", # Function name should be lowercase (use engineering notation for funcs)
    "N803", # Argument name should be lowercase (use engineering notation for vars)
    "N806", # Variable should be lowercase (use engineering notation for vars)
    "N815", # Variable should not be mixedCase (use engineering notation for vars)
    "SIM115", # Global variables used for printing: GET RID OF THIS ASAP!
    "F821", # Undefined name ... (too dynamic)
    "D1", # Missing docstring in ... (use doc coverage for now)
    "PLR09", # Too many statements/arguments/etc (preference)
    "PLR2004", # Magic value used in comparison (preference)
]

[tool.isort]
profile = "black"